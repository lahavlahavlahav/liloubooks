<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>תיקיית התבניות לבוגרות | Lilou Books</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/academy/academy.css">
  <style>
    .gate { max-width: 460px; margin: 0 auto; text-align: right; }
    .gate label { display: block; font-weight: 700; color: var(--warm-brown); margin: 14px 0 6px; font-size: .95rem; }
    .gate input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: var(--paper); color: var(--text); }
    .gate input:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
    .gate .btn { width: 100%; margin-top: 20px; border: 0; cursor: pointer; }
    .gate .btn[disabled] { opacity: .6; cursor: wait; }
    .gate .msg { margin-top: 12px; font-size: .95rem; color: #a3412f; min-height: 1.4em; }
    .gate .info { margin-top: 6px; color: var(--light-text); font-size: .95rem; }
    .gate .switch { display: block; margin: 14px auto 0; text-align: center; font-size: .95rem; background: none; border: 0; color: var(--warm-brown); text-decoration: underline; cursor: pointer; font-family: inherit; }
    .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; margin-top: 10px; }
    .pcard { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
    .pcard .thumb { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; display: block; background: var(--cream); border-bottom: 1px solid var(--line); }
    .pcard .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .pcard h3 { margin: 0; flex: 1; }
    .pcard .btn { text-align: center; padding: 10px 16px; font-size: .95rem; }
    .pcard .view { text-align: center; font-size: .9rem; color: var(--light-text); }
    .status { text-align: center; color: var(--light-text); padding: 30px 0; }
    .hello { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 22px; }
    .hello button { background: none; border: 0; color: var(--light-text); text-decoration: underline; cursor: pointer; font: inherit; font-size: .9rem; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="wrap-wide">
    <a class="brand latin" href="/">Lilou Books</a>
  </div>
</header>

<section class="hero" id="gateSection">
  <div class="wrap">
    <span class="eyebrow">לבוגרות הסדנאות בלבד</span>
    <h1>תיקיית התבניות שלך</h1>
    <p class="lead">כל התבניות שאני שולחת בקבוצת הוואטסאפ, שמורות כאן במקום אחד. הקלידי את הסיסמה שקיבלת בקבוצה.</p>

    <form class="gate" id="unlock" novalidate>
      <label for="pw">סיסמה</label>
      <input id="pw" name="pw" type="password" autocomplete="current-password" dir="ltr" required>
      <button class="btn" type="submit">כניסה לתבניות</button>
      <div class="msg" role="alert"></div>
    </form>
  </div>
</section>

<section id="library" hidden>
  <div class="wrap-wide">
    <div class="hello">
      <h2 style="margin:0">התבניות שלך</h2>
      <button type="button" id="logout">יציאה</button>
    </div>
    <div class="plist" id="plist"></div>
  </div>
</section>

<footer>
  <p>Lilou Books · להב ברק · <a href="mailto:liloubooks.com@gmail.com">liloubooks.com@gmail.com</a></p>
</footer>

<script>
(function () {
  // רשימת התבניות מוצפנת בסיסמה (AES-GCM, מפתח מ-PBKDF2). להוספת תבנית מצפינים את הרשימה מחדש.

  var KEY = 'lilouPatternsPw';
  var $ = function (s) { return document.querySelector(s); };

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function open(pw) {
    var c = window.crypto.subtle;
    return c.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return c.deriveKey({ name: 'PBKDF2', salt: b64(VAULT.s), iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (key) {
      return c.decrypt({ name: 'AES-GCM', iv: b64(VAULT.i) }, key, b64(VAULT.d));
    }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  function render(list) {
    $('#plist').innerHTML = list.map(function (p) {
      return '<div class="pcard">' +
        '<img class="thumb" src="' + esc(p.thumb) + '" alt="" loading="lazy">' +
        '<div class="body"><h3>' + esc(p.title) + '</h3>' +
        '<a class="btn" href="' + esc(p.file) + '" download="' + esc(p.title) + '.pdf">להורדת התבנית</a>' +
        '<a class="view" href="' + esc(p.file) + '" target="_blank" rel="noopener">צפייה לפני הורדה</a>' +
        '</div></div>';
    }).join('');
    $('#gateSection').hidden = true;
    $('#library').hidden = false;
  }

  $('#unlock').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target, pw = f.pw.value.trim(), btn = f.querySelector('.btn'), msg = f.querySelector('.msg');
    if (!pw) { msg.textContent = 'נא להקליד סיסמה'; return; }
    btn.disabled = true; msg.textContent = '';
    open(pw).then(function (list) {
      try { localStorage.setItem(KEY, pw); } catch (err) {}
      render(list);
    }).catch(function () {
      msg.textContent = 'הסיסמה לא נכונה. הסיסמה נמצאת בקבוצת הוואטסאפ של הבוגרות.';
    }).then(function () { btn.disabled = false; });
  });

  $('#logout').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (err) {}
    $('#pw').value = '';
    $('#library').hidden = true;
    $('#gateSection').hidden = false;
  });

  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (err) {}
  if (saved) open(saved).then(render).catch(function () { try { localStorage.removeItem(KEY); } catch (err) {} });
})();
</script>
</body>
</html>
